name: Windows-Clang-Tests

on:
  push:
    branches: [ "cicd" ]
  pull_request:
    branches: [ "cicd" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        #arch: ${{ (matrix.os == 'windows-latest' && matrix.cpp_compiler == 'g++') && 'win64_mingw' || '' }}
    
    - name: Setup MSVC Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64
        vsversion: '2022'
        
    # Handling LLVM bullshit, can be removed when the PR is merged
    # https://github.com/llvm/llvm-project/pull/160354
    - name: Copy DIA SDK
      shell: pwsh
      run: |
        Write-Host "Creating directory and copying DIA SDK..."
        New-Item -ItemType Directory -Force -Path "C:/Program Files (x86)/Microsoft Visual Studio/2019/Professional" | Out-Null
        Copy-Item -Path "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/DIA SDK" -Destination "C:/Program Files (x86)/Microsoft Visual Studio/2019/Professional/DIA SDK" -Recurse -Force
        Write-Host "DIA SDK copied successfully"
        
    - name: Build LLVM and Clang from source
      shell: pwsh
      run: |
        $llvmVersion = "21.1.8"
        $llvmInstallPath = "C:/llvm"
        $llvmBuildPath = "${{ github.workspace }}/llvm-build"
        
        Write-Host "Cloning LLVM $llvmVersion..."
        git clone --depth 1 --branch llvmorg-$llvmVersion https://github.com/llvm/llvm-project.git llvm-project
        
        Write-Host "Configuring LLVM and Clang with minimal components..."
        cmake -B $llvmBuildPath `
          -S llvm-project/llvm `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX=$llvmInstallPath `
          -DLLVM_ENABLE_RPMALLOC=OFF `
          -DLLVM_ENABLE_PROJECTS="clang" `
          -DLLVM_TARGETS_TO_BUILD="X86" `
          -DLLVM_INCLUDE_EXAMPLES=OFF `
          -DLLVM_INCLUDE_TESTS=OFF `
          -DLLVM_INCLUDE_BENCHMARKS=OFF `
          -DLLVM_INCLUDE_DOCS=OFF `
          -DLLVM_ENABLE_BINDINGS=OFF `
          -DLLVM_ENABLE_OCAMLDOC=OFF `
          -DLLVM_ENABLE_Z3_SOLVER=OFF `
          -DLLVM_BUILD_TOOLS=OFF `
          -DLLVM_BUILD_UTILS=OFF `
          -DCLANG_INCLUDE_TESTS=OFF `
          -DCLANG_INCLUDE_DOCS=OFF `
          -DCLANG_BUILD_EXAMPLES=OFF
        
        Write-Host "Building LLVM and Clang (this may take a while)..."
        cmake --build $llvmBuildPath --config Release
        
        Write-Host "Installing LLVM and Clang..."
        cmake --install $llvmBuildPath --config Release
        
        Write-Host "Setting environment variables..."
        $llvmCMakeDir = "$llvmInstallPath/lib/cmake/llvm"
        $clangCMakeDir = "$llvmInstallPath/lib/cmake/clang"
        $llvmBinDir = "$llvmInstallPath/bin"
        echo "LLVM_DIR=$llvmCMakeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "Clang_DIR=$clangCMakeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$llvmBinDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
        Write-Host "LLVM and Clang $llvmVersion built and installed to: $llvmInstallPath"
        
    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B "${{ github.workspace }}/build" `
          -G Ninja `
          -DCMAKE_C_COMPILER=clang `
          -DCMAKE_CXX_COMPILER=clang++ `
          -DCMAKE_BUILD_TYPE=Release `
          -DLLVM_DIR="$env:LLVM_DIR" `
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release
      
    - name: List build directory contents
      run: |
        Write-Host "=== Build Directory Structure ==="
        Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -eq ".exe" } | ForEach-Object { Write-Host $_.FullName }
        Write-Host "`n=== Full Tests Directory ==="
        if (Test-Path .\build\Tests) {
          Get-ChildItem -Path .\build\Tests -Recurse
        } else {
          Write-Host ".\build\Tests does not exist"
        }
        Write-Host "`n=== All .exe files in build ==="
        if (Test-Path .\build) {
          Get-ChildItem -Path .\build -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
        }
        
    - name: Run Test
      working-directory: ${{ github.workspace }}/build
      shell: pwsh
      run: .\AllInOne.exe
