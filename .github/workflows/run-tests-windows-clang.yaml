name: Windows-Clang-Tests

on:
  push:
    branches: [ "cicd" ]
  pull_request:
    branches: [ "cicd" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        #arch: ${{ (matrix.os == 'windows-latest' && matrix.cpp_compiler == 'g++') && 'win64_mingw' || '' }}

    - name: Setup MSVC Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64
        vsversion: '2019'
        
    - name: Download and Install LLVM
      shell: pwsh
      run: |
        $llvmVersion = "21.1.8"
        $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/clang+llvm-$llvmVersion-x86_64-pc-windows-msvc.tar.xz"
        $llvmArchive = "${{ github.workspace }}/llvm.tar.xz"
        $llvmExtractPath = "C:/llvm"
        
        Write-Host "Downloading LLVM $llvmVersion..."
        Invoke-WebRequest -Uri $llvmUrl -OutFile $llvmArchive
        
        Write-Host "Extracting LLVM..."
        New-Item -ItemType Directory -Force -Path $llvmExtractPath
        tar -xf $llvmArchive -C $llvmExtractPath --strip-components=1
        
        Write-Host "Setting environment variables..."
        $llvmCMakeDir = "$llvmExtractPath/lib/cmake/llvm"
        $llvmBinDir = "$llvmExtractPath/bin"
        echo "LLVM_DIR=$llvmCMakeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$llvmBinDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
        Write-Host "LLVM $llvmVersion installed to: $llvmExtractPath"
        Write-Host "LLVM_DIR set to: $llvmCMakeDir"
        Write-Host "Added to PATH: $llvmBinDir"

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B "${{ github.workspace }}/build" `
          -G Ninja `
          -DCMAKE_C_COMPILER=clang `
          -DCMAKE_CXX_COMPILER=clang++ `
          -DCMAKE_BUILD_TYPE=Release `
          -DLLVM_DIR="$env:LLVM_DIR" `
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release

    - name: Run Test
      working-directory: ${{ github.workspace }}/build
      run: ./Tests/AllInOne/AllInOne.exe
