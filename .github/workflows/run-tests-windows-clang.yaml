name: Windows-Clang-Tests

on:
  push:
    branches: [ "cicd" ]
  pull_request:
    branches: [ "cicd" ]

env:
  LLVM_CLANG_VERSION: '21.1.8'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
    
    - name: Setup MSVC Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64
        vsversion: '2022'
    
    - name: Cache LLVM-Clang
      id: cache-llvm-clang
      uses: actions/cache@v4
      with:
        path: C:/llvm
        key: windows-clang-llvm-${{ env.LLVM_CLANG_VERSION }}-x64-v1
        
    - name: Download LLVM-Clang from Release
      if: steps.cache-llvm-clang.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Write-Host "Downloading LLVM-Clang $env:LLVM_CLANG_VERSION from release..."
        $assetUrl = "https://github.com/${{ github.repository }}/releases/download/windows-clang-llvm-$env:LLVM_CLANG_VERSION/windows-clang-llvm-$env:LLVM_CLANG_VERSION-x64.zip"
        $outputPath = "${{ github.workspace }}/llvm-clang.zip"
        
        try {
          Invoke-WebRequest -Uri $assetUrl -OutFile $outputPath -ErrorAction Stop
          Write-Host "Download completed successfully"
        } catch {
          Write-Host "Error downloading LLVM-Clang: $_"
          Write-Host "Please run the 'Build and Cache LLVM-Clang' workflow first to create the release"
          exit 1
        }
        
        Write-Host "Extracting LLVM-Clang to C:/llvm..."
        Expand-Archive -Path $outputPath -DestinationPath "C:/llvm" -Force
        Write-Host "LLVM-Clang extracted successfully"
        
    - name: Verify and Setup LLVM-Clang
      shell: pwsh
      run: |
        $llvmInstallPath = "C:/llvm"
        
        Write-Host "=== Verifying LLVM-Clang installation ==="
        if (-not (Test-Path $llvmInstallPath)) {
          Write-Host "✗ ERROR: LLVM-Clang not found at $llvmInstallPath"
          exit 1
        }
        
        $llvmCMakeDir = "$llvmInstallPath/lib/cmake/llvm"
        $clangCMakeDir = "$llvmInstallPath/lib/cmake/clang"
        $llvmBinDir = "$llvmInstallPath/bin"
        
        Write-Host "✓ LLVM-Clang installation found"
        Write-Host "✓ Setting environment variables"
        
        echo "LLVM_DIR=$llvmCMakeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "Clang_DIR=$clangCMakeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$llvmBinDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            
    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B "${{ github.workspace }}/build" `
          -G Ninja `
          -DCMAKE_C_COMPILER=clang `
          -DCMAKE_CXX_COMPILER=clang++ `
          -DCMAKE_BUILD_TYPE=Release `
          -DLLVM_DIR="$env:LLVM_DIR" `
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release
      
    - name: List build directory contents
      run: |
        Write-Host "=== Build Directory Structure ==="
        Get-ChildItem -Path . -Recurse -File | Where-Object { $_.Extension -eq ".exe" } | ForEach-Object { Write-Host $_.FullName }
        Write-Host "`n=== Full Tests Directory ==="
        if (Test-Path .\build\Tests) {
          Get-ChildItem -Path .\build\Tests -Recurse
        } else {
          Write-Host ".\build\Tests does not exist"
        }
        Write-Host "`n=== All .exe files in build ==="
        if (Test-Path .\build) {
          Get-ChildItem -Path .\build -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object FullName
        }
        
    - name: Run Test
      working-directory: ${{ github.workspace }}/build
      shell: pwsh
      run: .\AllInOne.exe
