name: Windows-MSVC-Tests

on:
  push:
    branches: [ "cicd" ]
  pull_request:
    branches: [ "cicd" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        #arch: ${{ (matrix.os == 'windows-latest' && matrix.cpp_compiler == 'g++') && 'win64_mingw' || '' }}

    - name: Setup MSVC Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64
        vsversion: '2022'
    
    - name: Install LLVM
      id: llvm-install
      shell: pwsh
      run: |
        choco install llvm --version=21.1.8 -y
        Write-Host "=== Chocolatey Log Contents ==="
        Get-Content "C:\ProgramData\chocolatey\logs\chocolatey.log" -Tail 100
        $llvmPath = "C:\ProgramData\chocolatey\lib\llvm"
        Write-Host "LLVM installed at: $llvmPath"
        $llvmCMakePath = "$llvmPath\lib\cmake\llvm"
        Write-Host "LLVM CMake path: $llvmCMakePath"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "LLVM_DIR=$llvmCMakePath"

    - name: Configure CMake
      shell: pwsh
      run: |
        $llvmDir = "${{ steps.llvm-install.outputs.LLVM_DIR }}"
        cmake -B "${{ github.workspace }}/build" `
          -G Ninja `
          -DCMAKE_CXX_COMPILER=cl `
          -DCMAKE_BUILD_TYPE=Release `
          -DLLVM_DIR="$llvmDir" `
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release

    - name: Run Test
      working-directory: ${{ github.workspace }}/build
      run: ./Tests/AllInOne/AllInOne.exe
