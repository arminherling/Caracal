name: Windows-MSVC-Tests

on:
  push:
    branches: [ "cicd" ]
  pull_request:
    branches: [ "cicd" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.0'
        #arch: ${{ (matrix.os == 'windows-latest' && matrix.cpp_compiler == 'g++') && 'win64_mingw' || '' }}

    - name: Setup MSVC Developer Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64
        vsversion: '2022'
    
    - name: Download and Install LLVM
      shell: pwsh
      run: |
        $version = "21.1.8"
        $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz"
        $llvmArchive = "${{ github.workspace }}/llvm.tar.xz"
        $llvmExtractPath = "C:/llvm"
        
        Write-Host "Downloading LLVM..."
        Invoke-WebRequest -Uri $llvmUrl -OutFile $llvmArchive
        
        Write-Host "Extracting LLVM..."
        New-Item -ItemType Directory -Force -Path $llvmExtractPath
        tar -xf $llvmArchive -C $llvmExtractPath --strip-components=1
        
        Write-Host "Setting LLVM_DIR environment variable..."
        $llvmCMakeDir = "$llvmExtractPath/lib/cmake/llvm"
        echo "LLVM_DIR=$llvmCMakeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        
        Write-Host "LLVM installed to: $llvmExtractPath"
        Write-Host "LLVM_DIR set to: $llvmCMakeDir"

    - name: Debug LLVM Installation
      shell: pwsh
      run: |
        Write-Host "LLVM Path: $LLVM_DIR"
        Write-Host "Listing LLVM directory contents:"
        Get-ChildItem -Path "$LLVM_DIR" -Recurse -Depth 2
        Write-Host "`nChecking for CMake config files:"
        Get-ChildItem -Path "$LLVM_DIR" -Recurse -Filter "*LLVMConfig.cmake"

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B "${{ github.workspace }}/build" `
          -G Ninja `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DCMAKE_BUILD_TYPE=Release `
          -DLLVM_DIR="$env:LLVM_DIR" `
          -S "${{ github.workspace }}"

    - name: Build
      run: cmake --build ${{ github.workspace }}/build --config Release

    - name: Run Test
      working-directory: ${{ github.workspace }}/build
      run: ./Tests/AllInOne/AllInOne.exe
